name: Validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - name: Validate shell scripts
        run: |
          for script in install.sh bundle/install.sh bundle/opsrabbitctl bundle/migrate.sh bundle/scripts/*.sh tests/*.sh; do
            bash -n "$script"
          done
      - name: Test release discovery and failed upgrades
        run: bash tests/releases.test.sh
      - name: Test release migration and recovery in isolation
        run: |
          docker run --rm -v "$PWD:/work:ro" -w /work ubuntu:24.04 bash -c \
            'apt-get update -qq && apt-get install -y -qq jq curl >/dev/null && bash tests/release-lifecycle.test.sh'
      - name: Test operations helper
        run: bash tests/opsrabbitctl.test.sh
      - name: Test AWS authentication
        run: bash tests/aws-auth.test.sh
      - name: Test authentication user routing in isolation
        run: |
          docker run --rm -v "$PWD:/work:ro" -w /work ubuntu:24.04 bash -c \
            'apt-get update -qq && apt-get install -y -qq sudo python3 jq >/dev/null && python3 tests/auth-user-routing.test.py'
      - name: Test Docker installation
        run: sudo bash tests/docker-install.test.sh
      - name: Test AppArmor installation
        run: sudo bash tests/apparmor-install.test.sh
      - name: Validate AppArmor profiles
        run: |
          for profile in bundle/deploy/apparmor/*; do
            sudo apparmor_parser -Q "$profile"
          done
      - name: Validate Compose manifest
        env:
          OPSRABBIT_DAEMON_IMAGE: example.invalid/opsrabbit-daemon:test
          OPSRABBIT_WEB_IMAGE: example.invalid/opsrabbit-web:test
          OPSRABBIT_POSTGRES_PASSWORD: test
          BETTER_AUTH_SECRET: test
          OPSRABBIT_NODE_ENCRYPTION_KEY: test
          OPSRABBIT_SANDBOX_IMAGE: example.invalid/opsrabbit-sandbox:test
          OPENSANDBOX_SERVER_API_KEY: test
          OPENSANDBOX_PORT: "8080"
          OPSRABBIT_DOCKER_SOCKET_GID: "0"
          OPSRABBIT_WEB_ORIGIN: https://opsrabbit.example.com
          OPSRABBIT_NODE_BASE_URL: https://opsrabbit.example.com/api
        run: docker compose -f bundle/docker-compose.yml config --quiet
      - name: Build and inspect archive
        run: |
          tar -C bundle -czf opsrabbit-aws-image-bundle.tar.gz .
          tar -tzf opsrabbit-aws-image-bundle.tar.gz | tee archive-contents.txt
          grep -Fx './opensandbox-config.toml' archive-contents.txt
          grep -Fx './scripts/install-docker.sh' archive-contents.txt
          grep -Fx './scripts/aws-auth.sh' archive-contents.txt
          grep -Fx './scripts/releases.sh' archive-contents.txt
          grep -Fx './migrate.sh' archive-contents.txt
          grep -Fx './scripts/install-opensandbox-apparmor.sh' archive-contents.txt
          grep -Fx './deploy/apparmor/opsrabbit-opensandbox-bwrap' archive-contents.txt
          grep -Fx './deploy/apparmor/opsrabbit-opensandbox-browser' archive-contents.txt
