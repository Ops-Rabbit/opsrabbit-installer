name: Release installer

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - name: Validate shell scripts
        run: |
          for script in install.sh bundle/install.sh bundle/opsrabbitctl bundle/migrate.sh bundle/scripts/*.sh tests/*.sh; do
            bash -n "$script"
          done
      - name: Test release discovery and failed upgrades
        run: bash tests/releases.test.sh
      - name: Test release migration and recovery in isolation
        run: |
          docker run --rm -v "$PWD:/work:ro" -w /work ubuntu:24.04 bash -c \
            'apt-get update -qq && apt-get install -y -qq jq curl >/dev/null && bash tests/release-lifecycle.test.sh'
      - name: Test operations helper
        run: bash tests/opsrabbitctl.test.sh
      - name: Test AWS authentication
        run: bash tests/aws-auth.test.sh
      - name: Test authentication user routing in isolation
        run: |
          docker run --rm -v "$PWD:/work:ro" -w /work ubuntu:24.04 bash -c \
            'apt-get update -qq && apt-get install -y -qq sudo python3 jq >/dev/null && python3 tests/auth-user-routing.test.py'
      - name: Test Docker installation
        run: sudo bash tests/docker-install.test.sh
      - name: Test AppArmor installation
        run: sudo bash tests/apparmor-install.test.sh
      - name: Validate AppArmor profiles
        run: |
          for profile in bundle/deploy/apparmor/*; do
            sudo apparmor_parser -Q "$profile"
          done
      - name: Build release archive
        run: |
          mkdir -p release/assets release/opsrabbit-aws-image-bundle
          cp -a bundle/. release/opsrabbit-aws-image-bundle/
          cp install.sh release/assets/install.sh
          sed -i "s/^default_version=.*/default_version=\"${GITHUB_REF_NAME}\"/" release/assets/install.sh
          grep -F "default_version=\"${GITHUB_REF_NAME}\"" release/assets/install.sh
          tar -C release -czf opsrabbit-aws-image-bundle.tar.gz opsrabbit-aws-image-bundle
          tar -tzf opsrabbit-aws-image-bundle.tar.gz | tee archive-contents.txt
          grep -Fx 'opsrabbit-aws-image-bundle/opensandbox-config.toml' archive-contents.txt
          grep -Fx 'opsrabbit-aws-image-bundle/scripts/install-docker.sh' archive-contents.txt
          grep -Fx 'opsrabbit-aws-image-bundle/scripts/aws-auth.sh' archive-contents.txt
          grep -Fx 'opsrabbit-aws-image-bundle/scripts/releases.sh' archive-contents.txt
          grep -Fx 'opsrabbit-aws-image-bundle/migrate.sh' archive-contents.txt
          grep -Fx 'opsrabbit-aws-image-bundle/scripts/install-opensandbox-apparmor.sh' archive-contents.txt
          grep -Fx 'opsrabbit-aws-image-bundle/deploy/apparmor/opsrabbit-opensandbox-bwrap' archive-contents.txt
          grep -Fx 'opsrabbit-aws-image-bundle/deploy/apparmor/opsrabbit-opensandbox-browser' archive-contents.txt
          sha256sum opsrabbit-aws-image-bundle.tar.gz > opsrabbit-aws-image-bundle.tar.gz.sha256
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            release/assets/install.sh \
            opsrabbit-aws-image-bundle.tar.gz \
            opsrabbit-aws-image-bundle.tar.gz.sha256 \
            --generate-notes \
            --title "OpsRabbit installer ${GITHUB_REF_NAME}"
