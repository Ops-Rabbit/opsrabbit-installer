AWSTemplateFormatVersion: "2010-09-09"
Description: "OpsRabbit ECS Fargate reference stack (starter). Uses image-only container paths."

Rules:
  DatabaseEgressRequired:
    Description: "Either DatabaseSecurityGroupId or DatabaseCidr must be set when deploying with a database in another security domain."
    Assertions:
      - Assert:
          Fn::Or:
            - Fn::Not:
                - Fn::Equals:
                    - Ref: DatabaseSecurityGroupId
                    - ""
            - Fn::Not:
                - Fn::Equals:
                    - Ref: DatabaseCidr
                    - ""
        AssertDescription: "Set DatabaseSecurityGroupId or DatabaseCidr before launching the stack."

Parameters:
  StackName:
    Type: String
    Default: opsrabbit-ecs
  ClusterName:
    Type: String
    Default: opsrabbit-cluster
  VpcId:
    Type: AWS::EC2::VPC::Id
  PublicSubnets:
    Type: List<AWS::EC2::Subnet::Id>
  PrivateSubnets:
    Type: List<AWS::EC2::Subnet::Id>
  ExecutionRoleArn:
    Type: String
  TaskRoleArn:
    Type: String
  ALBName:
    Type: String
    Default: opsrabbit-alb
  DesiredCount:
    Type: Number
    Default: 1
  Cpu:
    Type: Number
    Default: 512
  Memory:
    Type: Number
    Default: 2048
  OPSRABBIT_DAEMON_IMAGE:
    Type: String
  OPSRABBIT_WEB_IMAGE:
    Type: String
  OPSRABBIT_NODE_DATABASE_URL:
    Type: String
    NoEcho: true
  BETTER_AUTH_SECRET:
    Type: String
    NoEcho: true
  OPSRABBIT_NODE_ENCRYPTION_KEY:
    Type: String
    NoEcho: true
  OPSRABBIT_WEB_ORIGIN:
    Type: String
  OPSRABBIT_NODE_BASE_URL:
    Type: String
  OPSRABBIT_BACKEND_PORT:
    Type: Number
    Default: 8384
  WEB_HTTP_PORT:
    Type: Number
    Default: 80
  UseHttps:
    Type: String
    Default: "false"
    AllowedValues:
      - "true"
      - "false"
    Description: "Set to true to create HTTPS listener on 443 and redirect HTTP to HTTPS."
  CertificateArn:
    Type: String
    Default: ""
    Description: "Required when UseHttps=true. ACM certificate ARN in the same region as this stack."
  DatabaseSecurityGroupId:
    Type: String
    Default: ""
    Description: "Optional RDS/DB security group id for restricted egress to Postgres on 5432."
  DatabaseCidr:
    Type: String
    Default: ""
    Description: "Optional CIDR for DB egress (alternative to DatabaseSecurityGroupId)."
  AllowedEgressCidr:
    Type: String
    Default: "0.0.0.0/0"
    Description: "CIDR to allow outbound HTTPS (443) traffic for external services. Narrow this in production."

Conditions:
  EnableHttps: !Equals [!Ref UseHttps, "true"]
  HasDbSecurityGroup: !Not [!Equals [!Ref DatabaseSecurityGroupId, ""]]
  HasDbCidr: !Not [!Equals [!Ref DatabaseCidr, ""]]

Resources:
  OpsRabbitCluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Ref ClusterName

  OpsRabbitLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/ecs/${StackName}/daemon"
      RetentionInDays: 14

  OpsRabbitWebLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/ecs/${StackName}/web"
      RetentionInDays: 14

  OpsRabbitTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub "${StackName}-task"
      NetworkMode: awsvpc
      RequiresCompatibilities:
        - FARGATE
      Cpu: !Ref Cpu
      Memory: !Ref Memory
      ExecutionRoleArn: !Ref ExecutionRoleArn
      TaskRoleArn: !Ref TaskRoleArn
      ContainerDefinitions:
        - Name: daemon
          Image: !Ref OPSRABBIT_DAEMON_IMAGE
          Essential: true
          StopTimeout: 135
          Environment:
            - Name: OPSRABBIT_NODE_HOST
              Value: "0.0.0.0"
            - Name: OPSRABBIT_NODE_PORT
              Value: !Ref OPSRABBIT_BACKEND_PORT
            - Name: OPSRABBIT_NODE_DATABASE_URL
              Value: !Ref OPSRABBIT_NODE_DATABASE_URL
            - Name: BETTER_AUTH_SECRET
              Value: !Ref BETTER_AUTH_SECRET
            - Name: OPSRABBIT_NODE_ENCRYPTION_KEY
              Value: !Ref OPSRABBIT_NODE_ENCRYPTION_KEY
            - Name: OPSRABBIT_WEB_ORIGIN
              Value: !Ref OPSRABBIT_WEB_ORIGIN
            - Name: OPSRABBIT_NODE_BASE_URL
              Value: !Ref OPSRABBIT_NODE_BASE_URL
          PortMappings:
            - ContainerPort: !Ref OPSRABBIT_BACKEND_PORT
              Protocol: tcp
          HealthCheck:
            Command:
              - CMD-SHELL
              - !Sub "curl -fsS http://127.0.0.1:${OPSRABBIT_BACKEND_PORT}/health"
            Interval: 30
            Timeout: 10
            Retries: 3
            StartPeriod: 30
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref OpsRabbitLogGroup
              awslogs-region: !Sub "${AWS::Region}"
              awslogs-stream-prefix: daemon
        - Name: web
          Image: !Ref OPSRABBIT_WEB_IMAGE
          Essential: true
          DependsOn:
            - Condition: HEALTHY
              ContainerName: daemon
          Environment:
            - Name: VITE_API_URL
              Value: /api
            - Name: WEB_API_UPSTREAM
              Value: !Sub "http://127.0.0.1:${OPSRABBIT_BACKEND_PORT}"
            - Name: WEB_TLS_MODE
              Value: http
          PortMappings:
            - ContainerPort: !Ref WEB_HTTP_PORT
              HostPort: !Ref WEB_HTTP_PORT
              Protocol: tcp
          HealthCheck:
            Command:
              - CMD-SHELL
              - "wget --spider --quiet http://127.0.0.1/"
            Interval: 30
            Timeout: 5
            Retries: 5
            StartPeriod: 10
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref OpsRabbitWebLogGroup
              awslogs-region: !Sub "${AWS::Region}"
              awslogs-stream-prefix: web

  OpsRabbitALBSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow ALB ingress for OpsRabbit web
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: !Ref WEB_HTTP_PORT
          ToPort: !Ref WEB_HTTP_PORT
          CidrIp: 0.0.0.0/0

  OpsRabbitServiceSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow web traffic to web and internal backend call path
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: !Ref WEB_HTTP_PORT
          ToPort: !Ref WEB_HTTP_PORT
          SourceSecurityGroupId: !Ref OpsRabbitALBSecurityGroup
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: !Ref AllowedEgressCidr

  OpsRabbitServiceDbEgress:
    Type: AWS::EC2::SecurityGroupEgress
    Condition: HasDbSecurityGroup
    Properties:
      GroupId: !Ref OpsRabbitServiceSecurityGroup
      IpProtocol: tcp
      FromPort: 5432
      ToPort: 5432
      DestinationSecurityGroupId: !Ref DatabaseSecurityGroupId

  OpsRabbitServiceDbCidrEgress:
    Type: AWS::EC2::SecurityGroupEgress
    Condition: HasDbCidr
    Properties:
      GroupId: !Ref OpsRabbitServiceSecurityGroup
      IpProtocol: tcp
      FromPort: 5432
      ToPort: 5432
      CidrIp: !Ref DatabaseCidr

  OpsRabbitTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub "${StackName}-web"
      Port: !Ref WEB_HTTP_PORT
      Protocol: HTTP
      VpcId: !Ref VpcId
      TargetType: ip
      HealthCheckPath: /
      Matcher:
        HttpCode: 200

  OpsRabbitAlb:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: !Ref ALBName
      Scheme: internet-facing
      Type: application
      Subnets: !Ref PublicSubnets
      SecurityGroups:
        - !Ref OpsRabbitALBSecurityGroup
      IpAddressType: ipv4

  OpsRabbitAlbListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref OpsRabbitAlb
      Port: !Ref WEB_HTTP_PORT
      Protocol: HTTP
      DefaultActions: !If
        - EnableHttps
        -
          - Type: redirect
            RedirectConfig:
              Protocol: HTTPS
              Port: "443"
              Host: "#{host}"
              Path: /#{path}
              Query: "#{query}"
              StatusCode: HTTP_301
        -
          - Type: forward
            TargetGroupArn: !Ref OpsRabbitTargetGroup

  OpsRabbitAlbHttpsListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Condition: EnableHttps
    Properties:
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref OpsRabbitTargetGroup
      LoadBalancerArn: !Ref OpsRabbitAlb
      Port: 443
      Protocol: HTTPS
      Certificates:
        - CertificateArn: !Ref CertificateArn

  OpsRabbitService:
    Type: AWS::ECS::Service
    Properties:
      Cluster: !Ref OpsRabbitCluster
      ServiceName: !Sub "${StackName}-service"
      TaskDefinition: !Ref OpsRabbitTaskDefinition
      LaunchType: FARGATE
      DesiredCount: !Ref DesiredCount
      LoadBalancers:
        - ContainerName: web
          ContainerPort: !Ref WEB_HTTP_PORT
          TargetGroupArn: !Ref OpsRabbitTargetGroup
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: DISABLED
          SecurityGroups:
            - !Ref OpsRabbitServiceSecurityGroup
          Subnets: !Ref PrivateSubnets

Outputs:
  ClusterName:
    Value: !Ref ClusterName
  ServiceName:
    Value: !Ref OpsRabbitService
  WebUrl:
    Description: "HTTP URL of the OpsRabbit service"
    Value: !If
      - EnableHttps
      - !Sub "https://${OpsRabbitAlb.DNSName}"
      - !Sub "http://${OpsRabbitAlb.DNSName}"
*** End Patch
