AWSTemplateFormatVersion: "2010-09-09"
Description: "OpsRabbit on Amazon ECS Fargate with an existing Amazon RDS for PostgreSQL database."

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label: {default: Network}
        Parameters: [VpcId, PublicSubnets, PrivateSubnets, DatabaseSecurityGroupId, AllowedIngressCidr, AllowedHttpsEgressCidr]
      - Label: {default: Application}
        Parameters: [OpsRabbitDaemonImage, OpsRabbitWebImage, ApplicationSecretArn, PublicDomainName, CertificateArn]
      - Label: {default: Operations}
        Parameters: [StackName, DesiredCount, LogRetentionDays]

Rules:
  HttpsConfigurationRequired:
    Assertions:
      - Assert:
          Fn::And:
            - Fn::Not: [{Fn::Equals: [{Ref: CertificateArn}, ""]}]
            - Fn::Not: [{Fn::Equals: [{Ref: PublicDomainName}, ""]}]
        AssertDescription: "CertificateArn and PublicDomainName are required."

Parameters:
  StackName:
    Type: String
    Default: opsrabbit
    AllowedPattern: "[a-z][a-z0-9-]{2,20}"
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: "VPC containing the ALB, ECS tasks, EFS, and existing RDS database."
  PublicSubnets:
    Type: List<AWS::EC2::Subnet::Id>
    Description: "At least two public subnets in different Availability Zones."
  PrivateSubnets:
    Type: List<AWS::EC2::Subnet::Id>
    Description: "Exactly two private subnets in different Availability Zones."
  DatabaseSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
    Description: "Security group attached to the existing RDS for PostgreSQL database."
  AllowedIngressCidr:
    Type: String
    Description: "IPv4 CIDR allowed to reach HTTPS. Use 0.0.0.0/0 only for an intentionally public deployment."
    AllowedPattern: "^(?:[0-9]{1,3}\\.){3}[0-9]{1,3}/(?:[0-9]|[12][0-9]|3[0-2])$"
  AllowedHttpsEgressCidr:
    Type: String
    Default: "0.0.0.0/0"
    Description: "Outbound HTTPS CIDR for application integrations and AWS APIs."
    AllowedPattern: "^(?:[0-9]{1,3}\\.){3}[0-9]{1,3}/(?:[0-9]|[12][0-9]|3[0-2])$"
  OpsRabbitDaemonImage:
    Type: String
    MinLength: 20
    Description: "Immutable daemon image URI from this product's AWS Marketplace fulfillment page."
  OpsRabbitWebImage:
    Type: String
    MinLength: 20
    Description: "Immutable web image URI from this product's AWS Marketplace fulfillment page."
  ApplicationSecretArn:
    Type: String
    Description: "Secrets Manager JSON secret ARN with databaseUrl, betterAuthSecret, and encryptionKey keys."
    AllowedPattern: "^arn:[^:]+:secretsmanager:[^:]+:[0-9]{12}:secret:.+$"
  PublicDomainName:
    Type: String
    Description: "DNS name for OpsRabbit. Point it to the WebLoadBalancerDnsName output."
    AllowedPattern: "^(?=.{1,253}$)([A-Za-z0-9](?:[A-Za-z0-9-]{0,61}[A-Za-z0-9])?\\.)+[A-Za-z]{2,63}$"
  CertificateArn:
    Type: String
    Description: "Issued ACM certificate in this region covering PublicDomainName."
    AllowedPattern: "^arn:[^:]+:acm:[^:]+:[0-9]{12}:certificate/.+$"
  DesiredCount:
    Type: Number
    Default: 1
    MinValue: 1
    MaxValue: 10
  LogRetentionDays:
    Type: Number
    Default: 30
    AllowedValues: [7, 14, 30, 60, 90, 180, 365]

Resources:
  Cluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Sub "${StackName}-cluster"
      ClusterSettings: [{Name: containerInsights, Value: enabled}]

  DaemonLogGroup:
    Type: AWS::Logs::LogGroup
    Properties: {LogGroupName: !Sub "/ecs/${StackName}/daemon", RetentionInDays: !Ref LogRetentionDays}
  WebLogGroup:
    Type: AWS::Logs::LogGroup
    Properties: {LogGroupName: !Sub "/ecs/${StackName}/web", RetentionInDays: !Ref LogRetentionDays}

  TaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement: [{Effect: Allow, Principal: {Service: ecs-tasks.amazonaws.com}, Action: "sts:AssumeRole"}]
      ManagedPolicyArns: [arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy]
      Policies:
        - PolicyName: ReadApplicationSecret
          PolicyDocument:
            Version: "2012-10-17"
            Statement: [{Effect: Allow, Action: "secretsmanager:GetSecretValue", Resource: !Ref ApplicationSecretArn}]
  TaskRole:
    Type: AWS::IAM::Role
    Properties:
      Description: "Runtime identity. Add only permissions required by enabled OpsRabbit integrations."
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement: [{Effect: Allow, Principal: {Service: ecs-tasks.amazonaws.com}, Action: "sts:AssumeRole"}]

  AlbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: "Customer-selected HTTPS ingress to OpsRabbit"
      VpcId: !Ref VpcId
      SecurityGroupIngress: [{IpProtocol: tcp, FromPort: 443, ToPort: 443, CidrIp: !Ref AllowedIngressCidr}]
  ServiceSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: "ALB ingress and restricted task egress"
      VpcId: !Ref VpcId
      SecurityGroupIngress: [{IpProtocol: tcp, FromPort: 80, ToPort: 80, SourceSecurityGroupId: !Ref AlbSecurityGroup}]
      SecurityGroupEgress: [{IpProtocol: tcp, FromPort: 443, ToPort: 443, CidrIp: !Ref AllowedHttpsEgressCidr}]
  AlbToServiceEgress:
    Type: AWS::EC2::SecurityGroupEgress
    Properties: {GroupId: !Ref AlbSecurityGroup, IpProtocol: tcp, FromPort: 80, ToPort: 80, DestinationSecurityGroupId: !Ref ServiceSecurityGroup}
  DatabaseIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties: {GroupId: !Ref DatabaseSecurityGroupId, IpProtocol: tcp, FromPort: 5432, ToPort: 5432, SourceSecurityGroupId: !Ref ServiceSecurityGroup, Description: "PostgreSQL from OpsRabbit"}
  DatabaseEgress:
    Type: AWS::EC2::SecurityGroupEgress
    Properties: {GroupId: !Ref ServiceSecurityGroup, IpProtocol: tcp, FromPort: 5432, ToPort: 5432, DestinationSecurityGroupId: !Ref DatabaseSecurityGroupId}

  EfsSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: "Encrypted NFS from OpsRabbit tasks"
      VpcId: !Ref VpcId
      SecurityGroupIngress: [{IpProtocol: tcp, FromPort: 2049, ToPort: 2049, SourceSecurityGroupId: !Ref ServiceSecurityGroup}]
  EfsEgress:
    Type: AWS::EC2::SecurityGroupEgress
    Properties: {GroupId: !Ref ServiceSecurityGroup, IpProtocol: tcp, FromPort: 2049, ToPort: 2049, DestinationSecurityGroupId: !Ref EfsSecurityGroup}
  FileSystem:
    Type: AWS::EFS::FileSystem
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Encrypted: true
      BackupPolicy: {Status: ENABLED}
      FileSystemTags: [{Key: Name, Value: !Sub "${StackName}-persistent-data"}]
  MountTargetA:
    Type: AWS::EFS::MountTarget
    Properties: {FileSystemId: !Ref FileSystem, SubnetId: !Select [0, !Ref PrivateSubnets], SecurityGroups: [!Ref EfsSecurityGroup]}
  MountTargetB:
    Type: AWS::EFS::MountTarget
    Properties: {FileSystemId: !Ref FileSystem, SubnetId: !Select [1, !Ref PrivateSubnets], SecurityGroups: [!Ref EfsSecurityGroup]}

  DataAccessPoint:
    Type: AWS::EFS::AccessPoint
    Properties: {FileSystemId: !Ref FileSystem, PosixUser: {Uid: "1000", Gid: "1000"}, RootDirectory: {Path: /opsrabbit, CreationInfo: {OwnerUid: "1000", OwnerGid: "1000", Permissions: "0750"}}}
  BrowserAccessPoint:
    Type: AWS::EFS::AccessPoint
    Properties: {FileSystemId: !Ref FileSystem, PosixUser: {Uid: "1000", Gid: "1000"}, RootDirectory: {Path: /agent-browser, CreationInfo: {OwnerUid: "1000", OwnerGid: "1000", Permissions: "0750"}}}
  CodexAccessPoint:
    Type: AWS::EFS::AccessPoint
    Properties: {FileSystemId: !Ref FileSystem, PosixUser: {Uid: "1000", Gid: "1000"}, RootDirectory: {Path: /codex, CreationInfo: {OwnerUid: "1000", OwnerGid: "1000", Permissions: "0750"}}}
  GitAccessPoint:
    Type: AWS::EFS::AccessPoint
    Properties: {FileSystemId: !Ref FileSystem, PosixUser: {Uid: "1000", Gid: "1000"}, RootDirectory: {Path: /git, CreationInfo: {OwnerUid: "1000", OwnerGid: "1000", Permissions: "0750"}}}

  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    DependsOn: [MountTargetA, MountTargetB]
    Properties:
      Family: !Sub "${StackName}-task"
      NetworkMode: awsvpc
      RequiresCompatibilities: [FARGATE]
      Cpu: "512"
      Memory: "2048"
      ExecutionRoleArn: !GetAtt TaskExecutionRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      Volumes:
        - {Name: opsrabbit-data, EFSVolumeConfiguration: {FilesystemId: !Ref FileSystem, TransitEncryption: ENABLED, AuthorizationConfig: {AccessPointId: !Ref DataAccessPoint, IAM: DISABLED}}}
        - {Name: agent-browser, EFSVolumeConfiguration: {FilesystemId: !Ref FileSystem, TransitEncryption: ENABLED, AuthorizationConfig: {AccessPointId: !Ref BrowserAccessPoint, IAM: DISABLED}}}
        - {Name: codex-data, EFSVolumeConfiguration: {FilesystemId: !Ref FileSystem, TransitEncryption: ENABLED, AuthorizationConfig: {AccessPointId: !Ref CodexAccessPoint, IAM: DISABLED}}}
        - {Name: git-workspace, EFSVolumeConfiguration: {FilesystemId: !Ref FileSystem, TransitEncryption: ENABLED, AuthorizationConfig: {AccessPointId: !Ref GitAccessPoint, IAM: DISABLED}}}
      ContainerDefinitions:
        - Name: daemon
          Image: !Ref OpsRabbitDaemonImage
          Essential: true
          StopTimeout: 120
          Environment:
            - {Name: OPSRABBIT_NODE_HOST, Value: "0.0.0.0"}
            - {Name: OPSRABBIT_NODE_PORT, Value: "8384"}
            - {Name: OPSRABBIT_NODE_DATA_DIR, Value: /home/opsbot/.opsrabbit}
            - {Name: OPSRABBIT_NODE_WORKSPACE_DIR, Value: /home/opsbot/git}
            - {Name: OPSRABBIT_WEB_ORIGIN, Value: !Sub "https://${PublicDomainName}"}
            - {Name: OPSRABBIT_NODE_BASE_URL, Value: !Sub "https://${PublicDomainName}/api"}
          Secrets:
            - {Name: OPSRABBIT_NODE_DATABASE_URL, ValueFrom: !Sub "${ApplicationSecretArn}:databaseUrl::"}
            - {Name: BETTER_AUTH_SECRET, ValueFrom: !Sub "${ApplicationSecretArn}:betterAuthSecret::"}
            - {Name: OPSRABBIT_NODE_ENCRYPTION_KEY, ValueFrom: !Sub "${ApplicationSecretArn}:encryptionKey::"}
          MountPoints:
            - {SourceVolume: opsrabbit-data, ContainerPath: /home/opsbot/.opsrabbit}
            - {SourceVolume: agent-browser, ContainerPath: /home/opsbot/.agent-browser}
            - {SourceVolume: codex-data, ContainerPath: /home/opsbot/.codex}
            - {SourceVolume: git-workspace, ContainerPath: /home/opsbot/git}
          PortMappings: [{ContainerPort: 8384, Protocol: tcp}]
          HealthCheck:
            Command: [CMD-SHELL, "node -e \"fetch('http://127.0.0.1:8384/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
            Interval: 30
            Timeout: 10
            Retries: 3
            StartPeriod: 30
          LogConfiguration: {LogDriver: awslogs, Options: {awslogs-group: !Ref DaemonLogGroup, awslogs-region: !Ref "AWS::Region", awslogs-stream-prefix: daemon}}
        - Name: web
          Image: !Ref OpsRabbitWebImage
          Essential: true
          DependsOn: [{ContainerName: daemon, Condition: HEALTHY}]
          Environment:
            - {Name: VITE_API_URL, Value: /api}
            - {Name: WEB_API_UPSTREAM, Value: "http://127.0.0.1:8384"}
            - {Name: WEB_TLS_MODE, Value: http}
          PortMappings: [{ContainerPort: 80, Protocol: tcp}]
          HealthCheck: {Command: [CMD-SHELL, "wget --spider --quiet http://127.0.0.1/"], Interval: 30, Timeout: 5, Retries: 5, StartPeriod: 10}
          LogConfiguration: {LogDriver: awslogs, Options: {awslogs-group: !Ref WebLogGroup, awslogs-region: !Ref "AWS::Region", awslogs-stream-prefix: web}}

  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties: {Port: 80, Protocol: HTTP, VpcId: !Ref VpcId, TargetType: ip, HealthCheckPath: /, Matcher: {HttpCode: "200-399"}, TargetGroupAttributes: [{Key: deregistration_delay.timeout_seconds, Value: "120"}]}
  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties: {Scheme: internet-facing, Type: application, Subnets: !Ref PublicSubnets, SecurityGroups: [!Ref AlbSecurityGroup]}
  HttpsListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: 443
      Protocol: HTTPS
      SslPolicy: ELBSecurityPolicy-TLS13-1-2-2021-06
      Certificates: [{CertificateArn: !Ref CertificateArn}]
      DefaultActions: [{Type: forward, TargetGroupArn: !Ref TargetGroup}]
  Service:
    Type: AWS::ECS::Service
    DependsOn: HttpsListener
    Properties:
      Cluster: !Ref Cluster
      ServiceName: !Sub "${StackName}-service"
      TaskDefinition: !Ref TaskDefinition
      LaunchType: FARGATE
      PlatformVersion: "1.4.0"
      DesiredCount: !Ref DesiredCount
      DeploymentConfiguration: {DeploymentCircuitBreaker: {Enable: true, Rollback: true}, MinimumHealthyPercent: 100, MaximumPercent: 200}
      HealthCheckGracePeriodSeconds: 120
      LoadBalancers: [{ContainerName: web, ContainerPort: 80, TargetGroupArn: !Ref TargetGroup}]
      NetworkConfiguration: {AwsvpcConfiguration: {AssignPublicIp: DISABLED, SecurityGroups: [!Ref ServiceSecurityGroup], Subnets: !Ref PrivateSubnets}}
      PropagateTags: SERVICE

Outputs:
  ClusterName: {Value: !Ref Cluster}
  ServiceName: {Value: !GetAtt Service.Name}
  WebUrl: {Value: !Sub "https://${PublicDomainName}"}
  WebLoadBalancerDnsName:
    Description: "Create a DNS alias or CNAME for PublicDomainName pointing to this value."
    Value: !GetAtt LoadBalancer.DNSName
  FileSystemId:
    Description: "Retained encrypted EFS file system containing OpsRabbit persistent data."
    Value: !Ref FileSystem
