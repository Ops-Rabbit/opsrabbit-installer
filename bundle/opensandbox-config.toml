[server]
host = "0.0.0.0"
port = 8080
max_sandbox_timeout_seconds = 604800

[log]
level = "INFO"

[runtime]
type = "docker"
execd_image = "docker.io/opensandbox/execd:release-1.1.1@sha256:cda2bc35409bbf57561599b316cafb899598f7dce671332e7ceda14eb1cfeded"

[storage]
allowed_host_paths = []

[store]
type = "sqlite"
path = "/var/lib/opensandbox/opensandbox.db"

[docker]
network_mode = "bridge"
host_ip = "host.docker.internal"
# Dedicated pool below Linux's usual ephemeral range; check host availability.
# A larger pool reduces collisions but does not fix the upstream allocator.
port_range_min = 20000
port_range_max = 29999
drop_capabilities = ["AUDIT_WRITE", "MKNOD", "NET_ADMIN", "NET_RAW", "SYS_ADMIN", "SYS_MODULE", "SYS_PTRACE", "SYS_TIME", "SYS_TTY_CONFIG"]
no_new_privileges = true
pids_limit = 4096

[ingress]
mode = "direct"

[egress]
image = "docker.io/opensandbox/egress:release-1.1.1@sha256:bce2cc2e4dc3a3594678b91ac29efb0669fccebfdfc137727018d3b087fbb13a"
mode = "dns+nft"
disable_ipv6 = true
readiness_timeout_seconds = 30.0

[renew_intent]
enabled = false
min_interval_seconds = 60
